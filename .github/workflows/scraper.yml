name: Story Scraper

on:
  # Scheduled: scrape trending stories daily at 2 AM UTC
  # schedule:
  #   - cron: '0 2 * * *'

  # On-demand: triggered by Supabase Edge Function
  repository_dispatch:
    types: [scrape-story, search-sources]

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: scrape or search'
        required: true
        default: 'scrape'
        type: choice
        options:
          - scrape
          - search
      source_url:
        description: 'Story source URL (for scrape mode)'
        required: false
        type: string
      search_query:
        description: 'Search query (for search mode)'
        required: false
        type: string
      chapter_start:
        description: 'Start chapter number'
        required: false
        default: '1'
        type: string
      chapter_limit:
        description: 'Number of chapters to scrape (0 for all)'
        required: false
        default: '5'
        type: string
      force_rediscover:
        description: 'Force AI re-discovery of selectors (ignore cached scrape_sources)'
        required: false
        default: false
        type: boolean
      force_rescrape:
        description: 'Force overwrite existing chapters in R2/Supabase'
        required: false
        default: false
        type: boolean
      force_browser:
        description: 'Force Playwright browser mode (skip curl_cffi HTTP tier)'
        required: false
        default: false
        type: boolean
      chapter_order:
        description: 'Chapter list ordering (auto, asc, desc)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - asc
          - desc
env:
  SCRAPER_DIR: scrapling # Set to 'scrapling' to use the Scrapling engine

jobs:
  scrape:
    if: >
      github.event_name == 'schedule' ||
      github.event.action == 'scrape-story' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'scrape')
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ env.SCRAPER_DIR }}/requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles(format('{0}/requirements.txt', env.SCRAPER_DIR)) }}

      - name: Install dependencies
        run: |
          pip install -r ${{ env.SCRAPER_DIR }}/requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            if python -c "import rebrowser_playwright" 2>/dev/null; then
              python -m rebrowser_playwright install chromium
            else
              playwright install chromium
            fi
          fi
          if python -c "import rebrowser_playwright" 2>/dev/null; then
            python -m rebrowser_playwright install-deps chromium
          else
            playwright install-deps chromium
          fi

      - name: Run scraper
        working-directory: ${{ env.SCRAPER_DIR }}
        run: python -u scraper.py
        env:
          STORY_SOURCE_URL: ${{ github.event.client_payload.source_url || github.event.inputs.source_url || '' }}
          CHAPTER_START: ${{ github.event.client_payload.chapter_start || github.event.inputs.chapter_start || '1' }}
          CHAPTER_LIMIT: ${{ github.event.client_payload.chapter_limit || github.event.inputs.chapter_limit || '0' }}
          JOB_ID: ${{ github.event.client_payload.job_id || '' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_SELECTOR_MODEL: 'gemini-2.5-flash'
          SCRAPE_MIN_DELAY: '1.0'
          SCRAPE_MAX_DELAY: '2.5'
          USE_FREE_PROXY: 'true'
          FORCE_REDISCOVER: ${{ github.event.client_payload.force_rediscover || github.event.inputs.force_rediscover || 'false' }}
          FORCE_RESCRAPE: ${{ github.event.client_payload.force_rescrape || github.event.inputs.force_rescrape || 'false' }}
          FORCE_BROWSER: ${{ github.event.client_payload.force_browser || github.event.inputs.force_browser || 'false' }}
          CHAPTER_ORDER: ${{ github.event.client_payload.chapter_order || github.event.inputs.chapter_order || 'auto' }}

  search:
    if: >
      github.event.action == 'search-sources' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'search')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ env.SCRAPER_DIR }}/requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles(format('{0}/requirements.txt', env.SCRAPER_DIR)) }}

      - name: Install dependencies
        run: |
          pip install -r ${{ env.SCRAPER_DIR }}/requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            if python -c "import rebrowser_playwright" 2>/dev/null; then
              python -m rebrowser_playwright install chromium
            else
              playwright install chromium
            fi
          fi
          if python -c "import rebrowser_playwright" 2>/dev/null; then
            python -m rebrowser_playwright install-deps chromium
          else
            playwright install-deps chromium
          fi

      - name: Run multi-source search
        working-directory: ${{ env.SCRAPER_DIR }}
        run: python -u search_sources.py "${{ github.event.client_payload.query || github.event.inputs.search_query }}"
        env:
          USE_FREE_PROXY: 'true'
