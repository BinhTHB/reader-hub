    - paragraph [ref=e6706] [cursor=pointer]: "\"Ba ba.\""
    - paragraph [ref=e6707] [cursor=pointer]: Đường Tam đột nhiên kêu một tiếng.
    - paragraph [ref=e6708] [cursor=pointer]: Đường Hạo đứng lại, quay đầu nhìn về phía hắn. Cặp lông mày rõ ràng có vài phần không kiên nhẫn.
