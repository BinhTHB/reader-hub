    - paragraph [ref=e6664] [cursor=pointer]: Võ công ghi lại trên Huyền Thiên Bảo Lục chỉ có sáu loại, phân biệt là nội công tâm pháp Huyền Thiên Công, luyện tay phương pháp Huyền Ngọc Thủ. Luyện nhãn phương pháp Tử Cực Ma Đồng.
    - paragraph [ref=e6665] [cursor=pointer]: "\"Cầm nã pháp\""
    - paragraph [ref=e6666] [cursor=pointer]: (phương pháp bắt) Khống Hạc Cầm Long, khinh thân phương pháp Quỷ Ảnh Mê Tung, cùng với ám khí sử dụng phương pháp, Ám Khí Bách Giải.
    - paragraph [ref=e6667] [cursor=pointer]: Năm loại trước là trụ cột. Không có trụ cột vững chắc. như thế nào có thể phát huy hết tinh túy của Đường Môn ám khí chứ?
    - paragraph [ref=e6668] [cursor=pointer]: Một tuổi đã bắt đầu tu luyện Huyền Thiên Công, bây giờ Đường Tam đã sắp sáu tuổi. Hắn như trước vẫn tu luyện cơ sở.
    - paragraph [ref=e6669] [cursor=pointer]: Nhà Đường Tam ở tại phía Tây Thánh Hồn thôn. Ở vị trí đầu thôn, ba gian phòng đất có thể nói đơn sơ nhất trong thôn. Giữa căn nhà, có một mộc bài đường kính chừng một thước, mặt trên vẽ một cái đơn sơ
    - paragraph [ref=e6670] [cursor=pointer]: "\"chuy tử\""
    - paragraph [ref=e6671] [cursor=pointer]: (chùy), chuy tử ở thế giới này, nghiễm nhiên đại biểu ý nghĩa chính là thợ rèn.
    - paragraph [ref=e6672] [cursor=pointer]: Đúng vậy, Đường Hạo, cha của Đường Tam chính là một thợ rèn. Thợ rèn duy nhất trong thôn.
    - paragraph [ref=e6673] [cursor=pointer]: Ở thế giới này. Thợ rèn có thể nói là một trong những nghề thấp hèn nhất. Bởi vì đặc thù nguyên nhân nào đó, thế giới này đỉnh cấp vũ khí cũng không phải do thợ rèn làm ra.
    - paragraph [ref=e6674] [cursor=pointer]: Nhưng là, thợ rèn duy nhất trong thôn, vốn nhà Đường Tam không nghèo khó như vậy. nhưng là, về điểm này, thu nhập ít ỏi hầu hết đều......
    - paragraph [ref=e6675] [cursor=pointer]: Vừa vào đến cửa, Đường Tam đã ngửi thấy được mùi cơm, đó cũng không phải là Đường Hạo vì hắn chuẩn bị, mà là hắn chuẩn bị vì Đường Hạo.
    - paragraph [ref=e6676] [cursor=pointer]: Từ lúc mới bốn tuổi, Đường Tam thân cao vẫn chưa cao bằng táo thai (bệ bếp), nấu cơm cũng là nhiệm vụ của hắn mỗi ngày. Cho dù là phải đứng trên ghế mới có thể tới mặt bếp.
    - paragraph [ref=e6677] [cursor=pointer]: Cũng không phải Đường Hạo yêu cầu hắn làm như vậy, mà là bởi vì không như vậy, Đường Tam cơ hồ không lúc nào có thể ăn no.
    - paragraph [ref=e6678] [cursor=pointer]: Đi tới trước bếp, thuần thục đứng trên ghế,mở vung nồi lớn trước mặt, tức thì mùi hương truyền đến, cháo đã sớm chín rồi.
    - paragraph [ref=e6679] [cursor=pointer]: Mỗi ngày trước khi lên núi. Đường Tam đều cho gạo vào nồi, chuẩn bị đủ củi. Chờ hắn khi trở về, cháo đã chín rồi.
    - paragraph [ref=e6680] [cursor=pointer]: Cầm lấy hai cái bát sứt mẻ đã hơn mười chỗ gần
    - paragraph [ref=e6681] [cursor=pointer]: "\"táo thai\""
    - paragraph [ref=e6682] [cursor=pointer]: (bệ bếp), Đường Tam cẩn thận múc đầy hai chén cháo. Sau khi đặt lên bàn, gạo trong cháo có thể đếm được, đối với Đường Tam đang tuổi lớn chừng ấy dinh dưỡng hiển nhiên là không đủ, đây cũng là nguyên nhân tại sao thân thể hắn nhỏ bé, gầy gò như vậy.
    - paragraph [ref=e6683] [cursor=pointer]: "\"Ba ba. Ăn cơm thôi. \""
    - paragraph [ref=e6684] [cursor=pointer]: Đường Tam kêu lên. (Nghe giống đang gọi con ba ba nhỉJ)
    - paragraph [ref=e6685] [cursor=pointer]: Một lúc lâu sau, tấm màn cửa được nhấc lên, một thân ảnh cao lớn có chút lảo đảo bước ra.
    - paragraph [ref=e6686] [cursor=pointer]: Đó là một trung niên nam tử. Nhìn qua ước chừng gần năm mươi tuổi. Nhưng vóc người nhưng lại phi thường cao lớn khôi ngô, chỉ là trang phục hắn khiến người khác có chút coi thường.
    - paragraph [ref=e6687] [cursor=pointer]: Khoác trên người một tấm áo rách, thậm chí chỗ rách cũng không được vá lại, lộ ra phía dưới làn da màu cổ đồng, ngũ quan vốn coi như đoan chính lại bị phủ một tầng sáp vàng,
    - paragraph [ref=e6688] [cursor=pointer]: "\"mắt nhắm mắt mở\""
    - paragraph [ref=e6689] [cursor=pointer]: (thụy nhãn mông lung), mái tóc rối như tổ chim, râu mép đã không biết bao lâu rồi không có sửa sang lại, ánh mắt ngốc trệ mà tăm tối, mặc dù đã qua một đêm, nhưng mùi rượu trên người hắn vẫn còn làm Đường Tam không khỏi nhíu nhíu mày.
    - paragraph [ref=e6690] [cursor=pointer]: Đây là Đường Hạo, cha của Đường Tam ở thế giới này.
    - paragraph [ref=e6691] [cursor=pointer]: Từ nhỏ đến lớn. Đường Tam không biết cái gì gọi là tình cha. Đường Hạo đối với hắn, cho tới bây giờ đều là không để ý đến. Ban đầu còn nấu cơm cho hắn ăn. Nhưng theo thời gian trôi đi, lúc Đường Tam bắt đầu chủ động nấu cơm, Đường Hạo càng cái gì cũng mặc kệ, trong nhà nghèo khó như thế, thậm chí ngay cả bàn ghế cũng không có. Ăn cơm cũng là vấn đề, nguyên nhân chủ yếu là Đường Hạo đem hầu hết tiền công làm thợ rèn đều mua rượu để uống.
    - paragraph [ref=e6692] [cursor=pointer]: Cha của những hài tử tầm tuổi Đường Tam bình thường cũng khoảng ba mươi tuổi. Kết hôn sớm thậm chí còn không đến ba mươi tuổi. Nhưng Đường Hạo thoạt nhìn so với người ta già hơn nhiều, giống như là gia gia của Đường Tam vậy.
    - paragraph [ref=e6693] [cursor=pointer]: Đối với thái độ của Đường Hạo, Đường Tam cũng không oán hận. Một đời trước, hắn là cô nhi. Một đời này, mặc dù Đường Hạo đối với hắn không tốt, nhưng ít ra cũng có thân nhân. Đối với Đường Tam mà nói, điều này đã làm hắn thập phần thỏa mãn. Ít nhất, ở chỗ này có người để hắn gọi là ba ba.
    - paragraph [ref=e6694] [cursor=pointer]: Đường Hạo cầm lấy cái trên bàn, cũng không sợ nóng, từng ngụm từng ngụm đưa cháo vào bụng mình. Lúc này sắc mặt hắn nhìn mới tốt hơn vài phần.
    - paragraph [ref=e6695] [cursor=pointer]: "\"Ba ba, ngươi chậm một chút. Còn có mà.\""
    - paragraph [ref=e6696] [cursor=pointer]: Đường Tam cầm lấy bát trong tay cha mình, múc cho hắn một bát đầy cháo nữa. Chính mình cũng cầm lấy bát cháo lên húp.
    - paragraph [ref=e6697] [cursor=pointer]: Khi còn ở Đường Môn, hắn cũng không có đi đâu, đối với bên ngoài càng rất ít tiếp xúc. Vốn giống như tờ giấy trắng, tới thế giới này, một lần nữa làm một tiểu hài tử, cũng không có gì không thể tiếp nhận.
    - paragraph [ref=e6698] [cursor=pointer]: Rất nhanh, một nồi cháo có bảy, tám phần đều tiến vào bụng Đường Hạo, thở dài một hơi, đem bát đặt ở trên bàn. Mắt mở to ra vài phần, nhìn về phía Đường Tam.
    - paragraph [ref=e6699] [cursor=pointer]: "\"Có công việc ngươi trước hết cứ tiếp nhận. Xế chiều ta sẽ làm. Ta đi ngủ tiếp một hồi. \""
    - paragraph [ref=e6700] [cursor=pointer]: Thói quen của Đường Hạo rất có quy luật, buổi sáng đều là ngủ. Xế chiều
