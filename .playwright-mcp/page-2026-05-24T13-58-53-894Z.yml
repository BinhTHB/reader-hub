    - paragraph [ref=e6710] [cursor=pointer]: "\"Khối sắt có thể cho con dùng hay không?\""
    - paragraph [ref=e6711] [cursor=pointer]: Kiếp trước hắn là Đường Môn ngoại môn đệ tử xuất sắc nhất, đối với chế tạo các loại ám khí cực kỳ quen thuộc. Đương nhiên, khi đó các loại tài liệu đều là tùy Đường Môn cung cấp. Mà lúc tới thế giới này, hắn mặc dù tu luyện cũng đã vài năm. Nhưng thực lực còn xa mới đủ, đồng thời, hắn cũng chưa bao giờ nghĩ tới chuyện buông bỏ chế tạo ám khí mà chính mình am hiểu nhất. Hắn bây giờ đã bắt đầu thử
    - paragraph [ref=e6712] [cursor=pointer]: "\"đoán tạo\""
    - paragraph [ref=e6713] [cursor=pointer]: (chế tạo) một ít ám khí. Nhưng tài liệu lại thành đại vấn đề.
    - paragraph [ref=e6714] [cursor=pointer]: Kim loại mà Đường Hạo đánh tạo nông cụ đều là người trong thôn đưa tới. Đều là sắt thường rất nhiều tạp chất, rất khó chế tạo ra ám khí tốt. Lúc này khối sắt mà Đường Tam chỉ là ngày hôm qua vừa mới đưa tới. Làm Đường Tam kinh ngạc địa là, khối sắt này chứa một lượng nhất định thiết mẫu, dùng để chế tạo ám khí sẽ khá thích hợp.
