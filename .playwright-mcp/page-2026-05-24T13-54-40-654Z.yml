    - paragraph [ref=e3225] [cursor=pointer]: "\"Ba ba, ngươi lớn tuổi rồi, qua vài năm nữa, chờ ta lớn một chút, ngươi sẽ dạy ta đánh tạo công cụ, để ta làm thay công việc của ngươi nghen.\""
