    - paragraph [ref=e3259] [cursor=pointer]: Thổi lửa lên, khởi động ống bễ, hắn bắt đầu công việc của mình.
    - paragraph [ref=e3260] [cursor=pointer]: "\"Hô hô hô hô\""
    - paragraph [ref=e3261] [cursor=pointer]: tiếng ống bễ vang lên, lửa từ trong lò toát ra, đốt lên khối đại thiết, mặc dù Đường Tam cũng chưa học rèn, nhưng hắn thường xuyên xem Đường Hạo đánh tạo nông cụ, quá trình vẫn còn biết.
    - paragraph [ref=e3262] [cursor=pointer]: Sau khi khối sắt đã dần dần được thiêu đỏ, hắn đem thiết chùy Đường Hạo ngày thường vẫn dùng, đặt ở trên mặt đất, loại chùy cán dài này thậm chí so với hắn còn muốn cao hơn vài phần, bình thường hài tử năm, sáu tuổi căn bản không có khả năng cầm được, lại càng không nói là huy vũ nó để rèn liễu.
    - paragraph [ref=e3263] [cursor=pointer]: Nhưng Đường Tam vẫn đem nó cầm lên, Huyền Thiên Công nội lực vận toàn thân, mặc dù chưa đột phá đệ nhất trọng, nhưng hắn cũng đã có khí lực của người trưởng thành.
    - paragraph [ref=e3264] [cursor=pointer]: Đương, thiết chùy cùng khối sắt va chạm, phát ra một tiếng thanh thúy thanh âm, đây là Đường Tam lần đầu tiên đập xuống, cũng coi như vén tấm màn về rèn.
    - paragraph [ref=e3265] [cursor=pointer]: Trong phòng, Đường Hạo đang nằm trên giường chuyển thân, mặc dù hắn nhắm mắt lại, nhưng trên mặt thần sắc lại có vài phần kinh ngạc, thì thào,
    - paragraph [ref=e3266] [cursor=pointer]: "\"Cư nhiên cầm được chùy, trời sanh thần lực sao? \""
    - paragraph [ref=e3267] [cursor=pointer]: "\"Đương đương đương đương\""
    - paragraph [ref=e3268] [cursor=pointer]: Âm thanh trong lò rèn bắt đầu vang lên, Đường Hạo cùng Đường Tam phụ tử bắt đầu tiếp tục cuộc sống bình thản của bọn họ, chỉ là bất đồng là, từ ngày này bắt đầu, Đường Hạo chuẩn bị Đường Tam một cái hỏa lò trong phòng, để hắn chính mình rèn khối sắt nọ. Hắn không có chỉ điểm Đường Tam nửa câu, nhưng cũng từ ngày này bắt đầu, Đường Hạo rượu uống ít đi một chút, trong nhà thực vật cũng nhiều hơn một chút.
    - paragraph [ref=e3269] [cursor=pointer]: Rèn tuyệt đối là một quá trình buồn tẻ và mệt nhọc, nhưng Đường Tam lại đem nó trở thành quá trình ma luyện đối với thân thể mình. Đã qua mười một ngày, hắn thủy chung vẫn đang đếm số lần đập, muốn huy động thiết chùy, bằng vào lực lượng của thân thể hắn là không cách nào làm được, phải có Huyền Thiên Công phụ trợ.
    - paragraph [ref=e3270] [cursor=pointer]: Hắn toàn bộ công lực, ước chừng đủ huy động tầm một trăm chùy, mỗi khi công lực tiêu hao hầu như không còn, hắn liền khoanh chân ngồi dưới đất khôi phục, nội lực khôi phục đủ liền lập tức tiếp tục rèn.
    - paragraph [ref=e3271] [cursor=pointer]: Đây không chỉ là thân thể rèn luyện, lặp đi lặp lại tiêu hao, khôi phục, đối với hắn Huyền Thiên Công cùng ý chí cũng là một loại ma luyện rất tốt. Đáng tiếc chính là, Huyền Thiên Công đệ nhất trọng bình cảnh lại như là bích lũy
    - paragraph [ref=e3272] [cursor=pointer]: "\"kiên bất khả tồi\""
    - paragraph [ref=e3273] [cursor=pointer]: (vững chắc không thể phá hủy), Đường Tam tu luyện không phải không khắc khổ, hắn thiên phú cũng đủ, nhưng chỉ là không có cách nào đột phá tiến vào đệ nhị trọng.
    - paragraph [ref=e3274] [cursor=pointer]: Nhưng hắn đích rèn luyện cũng không uổng phí, mặc dù Huyền Thiên Công không thể đột phá, nhưng cỗ nội lực lại theo hắn quá trình hắn rèn khối sắt kia mà trở nên càng thêm cứng cỏi, tốc độ khôi phục tựa hồ so với trước kia cũng nhanh hơn một điểm.
    - paragraph [ref=e3275] [cursor=pointer]: Mười một ngày trôi qua, Đường Tam đã đánh ra hơn tám ngàn chùy, khối sắt không ngừng nhỏ đi, đã không được một phần ba thể tích ban đầu. Thân thể rèn luyện cùng thực vật tăng nhiều, hắn thân thể trở nên tráng kiện hơn vài phần, phảng phất có một cỗ khí lực phát ra từ trong cơ thể từ từ rót vào cơ thể hắn, làm hắn trong quá trình không ngừng rèn, nội lực tiêu hao từ từ giảm thiểu. Mà trong khi toàn bộ nội lực trợ giúp, lực lượng cũng tăng lên rất nhiều.
    - paragraph [ref=e3276] [cursor=pointer]: Khi hắn nện xuống một ngàn chùy đích, khối sắt nọ cũng đã xuất hiện biến hóa nhất định, nhỏ đi một vòng, mặc dù đang bị lửa thiêu đỏ bừng, nhưng cũng mơ hồ có thể thấy, tạp chất bên trong tựa hồ giảm bớt rất nhiều.
    - paragraph [ref=e3277] [cursor=pointer]: Bách luyện thành cương, từ này xuất hiện trong đầu Đường Tam, điều này càng thêm kiên định quyết tâm hoàn thành một vạn chùy của hắn. Mà khoảng cách đến mục tiêu này cũng đã rất gần.
    - paragraph [ref=e3278] [cursor=pointer]: Đường Tam kiên trì làm Đường Hạo rất kinh ngạc, vì hắn xem ra, cho dù là con trai mình trời sanh thần lực, cũng không thể kiên trì quá ba ngày. Cán thiết chùy để dễ dàng làm thì rất thô, không ngừng huy động, cùng bàn tay cọ xát, tất nhiên sẽ mang đến cho bàn tay thương tổn rất lớn. Nhưng hắn lại phát hiện, Đường Tam mặc dù cật lực rèn, nhưng đôi tay nhỏ bé non nớt kia nhìn qua không có gì biến hóa. Thậm chí ngay cả một cái thủy phao (phồng nước) cũng không có nổi lên.
